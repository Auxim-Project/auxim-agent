name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Auxim.Agent.sln --source https://api.nuget.org/v3/index.json
      - name: Build
        run: dotnet build Auxim.Agent.sln -c Release --no-restore
      - name: Test
        run: dotnet test Auxim.Agent.sln -c Release --no-build --no-restore
